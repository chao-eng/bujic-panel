name: Build and Push Docker Image to Aliyun ACR

on:
  # 仅支持手动触发，构建时录入版本号作为镜像 tag
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号（例如 1.2.0 或 v1.2.0）'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 设置 QEMU 方便构建多架构镜像
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 设置 Docker Buildx 以启用更高级的构建特性和缓存支持
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 校验并规范化手动录入的版本号
      - name: Resolve Version Tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(echo "$INPUT_VERSION" | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "版本号不能为空" >&2
            exit 1
          fi
          echo "tag=$version" >> $GITHUB_OUTPUT
          echo "本次构建版本号: $version"

      # 登录到阿里云容器镜像服务 (ACR)
      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # 构建并推送镜像
      - name: Build and Push to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 显式指定构建多平台架构镜像，支持 AMD64 (x86_64) 和 ARM64 (Apple M系列/树莓派/ARM云服务器等)
          platforms: linux/amd64,linux/arm64
          # 关闭 SBOM/provenance 证明清单：ACR 会拒绝 oci.empty 清单导致推送失败
          provenance: false
          sbom: false
          # 每次手动构建同时发布两个标签：录入的版本号与最新版（latest）
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPOSITORY }}:${{ steps.version.outputs.tag }}
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${{ secrets.ALIYUN_REPOSITORY }}:latest
          # 启用 GitHub Actions 缓存，加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
